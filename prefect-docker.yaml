name: mlex_prefect_worker_docker
prefect-version: 3.4.2

build: null
push: null

# Pull steps for Docker worker - uses container path
pull:
- prefect.deployments.steps.set_working_directory:
    directory: "{{ $CONTAINER_WORK_DIR }}"

deployments:
- name: launch_docker
  version: 0.1.0
  tags: []
  concurrency_limit: null
  description: Launch docker job (native docker worker)
  entrypoint: flows/docker/docker_flows.py:launch_docker
  parameters: {}
  work_pool:
    name: docker_pool
    work_queue_name: default-queue
    job_variables:
      image: "prefect-with-docker:latest"
      image_pull_policy: "Never"
      volumes:
        - "/var/run/docker.sock:/var/run/docker.sock"
        - "{{ $PREFECT_WORK_DIR }}:{{ $CONTAINER_WORK_DIR }}"
      env:
        PYTHONPATH: "{{ $CONTAINER_WORK_DIR }}"
        CONTAINER_WORK_DIR: "{{ $CONTAINER_WORK_DIR }}"
        PREFECT_WORK_DIR: "{{ $PREFECT_WORK_DIR }}"
      auto_remove: true
      stream_output: true
  schedules: []